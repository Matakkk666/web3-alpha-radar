services:
  radar:
    build: .
    container_name: radar
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    # Chromium crashes with Docker's default 64 MB /dev/shm.
    shm_size: "1gb"
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
